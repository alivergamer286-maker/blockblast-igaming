version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: blockblast-postgres
    environment:
      POSTGRES_USER: blockblast
      POSTGRES_PASSWORD: blockblast_secret
      POSTGRES_DB: blockblast
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockblast"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: blockblast-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blockblast-backend
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://blockblast:blockblast_secret@postgres:5432/blockblast
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change_this_in_production_super_secret_key_2026
      NODE_ENV: development
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: blockblast-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3001
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
